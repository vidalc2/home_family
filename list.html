<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#5b6ef5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Costco List">
    <title>Costco Shopping List</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body class="has-bottom-bar">
    <div class="app-header">
        <img class="logo" src="family-logo.png" alt="Family Logo">
        <h1>🛒 Costco Ancaster</h1>
        <p class="subtitle" id="subtitle">Shopping list</p>
    </div>

    <div class="card">
        <div class="counter" id="counter"></div>
        <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    </div>

    <div id="list"></div>

    <div class="card add-card">
        <h3 id="add-title">➕ Add Item</h3>
        <div class="row">
            <input type="text" class="field" id="custom-item" placeholder="Enter item name">
            <button class="btn-add" onclick="addCustomItem()">Add</button>
        </div>
    </div>

    <div class="back"><a href="index.html" id="back-link">← Back to main list</a></div>

    <div class="bottom-bar">
        <button class="btn btn-green" onclick="doneShopping()" id="done-btn">✅ Done Shopping</button>
    </div>

    <script src="data.js?v=2"></script>
    <script>
    (function () {
        'use strict';
        var params = new URLSearchParams(window.location.search);
        var lang = params.get('l') || params.get('lang') || 'en';
        document.documentElement.lang = lang;

        var T = {
            en: { subtitle: 'Shopping list', add: '➕ Add Item', addPh: 'Enter item name', addBtn: 'Add',
                  back: '← Back to main list', done: '✅ Done Shopping',
                  remaining: function (r, t) { return '<b>' + r + '</b> of ' + t + ' left'; },
                  allDone: '🎉 All items collected!', added: '➕ Added Items', pending: 'added',
                  emptyName: 'Please enter an item name', cost: 'Enter total amount paid (optional):',
                  share: 'Share this shopping summary with the family?', found: 'Found', missing: 'Missing',
                  total: 'Total', notProvided: 'Not provided', copied: '✅ Summary copied — paste it in WhatsApp or email.',
                  savedLocal: '✅ Summary saved on this device.', returnQ: 'Return to main list?', empty: 'This list is empty.' },
            pt: { subtitle: 'Lista de compras', add: '➕ Adicionar Item', addPh: 'Nome do item', addBtn: 'Add',
                  back: '← Voltar à lista principal', done: '✅ Compras Concluídas',
                  remaining: function (r, t) { return '<b>' + r + '</b> de ' + t + ' restantes'; },
                  allDone: '🎉 Todos os itens coletados!', added: '➕ Itens Adicionados', pending: 'adicionado',
                  emptyName: 'Digite o nome do item', cost: 'Valor total pago (opcional):',
                  share: 'Compartilhar este resumo com a família?', found: 'Encontrados', missing: 'Faltaram',
                  total: 'Total', notProvided: 'Não informado', copied: '✅ Resumo copiado — cole no WhatsApp ou email.',
                  savedLocal: '✅ Resumo salvo neste dispositivo.', returnQ: 'Voltar à lista principal?', empty: 'Esta lista está vazia.' }
        }[lang] || null;
        var t = T || { subtitle: '', add: '➕ Add Item', addPh: 'Enter item name', addBtn: 'Add', back: '← Back', done: '✅ Done',
            remaining: function (r, x) { return r + '/' + x; }, allDone: 'Done', added: 'Added', pending: 'added',
            emptyName: '', cost: '', share: '', found: 'Found', missing: 'Missing', total: 'Total', notProvided: '-',
            copied: '', savedLocal: '', returnQ: '', empty: 'Empty.' };

        document.getElementById('subtitle').textContent = t.subtitle;
        document.getElementById('add-title').textContent = t.add;
        document.getElementById('custom-item').placeholder = t.addPh;
        document.getElementById('back-link').textContent = t.back;
        document.getElementById('done-btn').textContent = t.done;

        /* ---- Resolve selection from the URL --------------------- */
        var selection = [];   // { cat, item, qty, name, emoji }
        var code = params.get('d');
        if (code) {
            COSTCO.decode(code).forEach(function (d) {
                selection.push({ cat: d.cat, item: d.item, qty: d.qty, name: COSTCO.name(d, lang), emoji: COSTCO.itemEmoji(COSTCO.name(d, lang)) });
            });
        } else if (params.get('items')) {
            // Backward compatibility with old long links
            var qtys = params.get('qtys') ? JSON.parse(decodeURIComponent(params.get('qtys'))) : {};
            params.get('items').split(',').forEach(function (id) {
                var gi = COSTCO.idToGi(id);
                if (gi === undefined) return;
                var f = COSTCO.flat[gi];
                var nm = COSTCO.name(f, lang);
                selection.push({ cat: f.cat, item: f.item, qty: parseInt(qtys[id], 10) || 1, name: nm, emoji: COSTCO.itemEmoji(nm) });
            });
        }

        // Order by the optimized store route, then by item order within a section
        selection.sort(function (a, b) {
            return (COSTCO.routePos(a.cat) - COSTCO.routePos(b.cat)) || (a.item - b.item);
        });

        // Custom items (free text)
        var customFromUrl = [];
        if (params.get('c')) customFromUrl = COSTCO.decodeCustom(params.get('c'));
        else if (params.get('custom')) { try { customFromUrl = JSON.parse(decodeURIComponent(params.get('custom'))); } catch (e) {} }

        /* ---- Render -------------------------------------------- */
        var listEl = document.getElementById('list');
        var total = selection.length + customFromUrl.length;
        var sections = {};   // cat -> { wrap, body, header, total, stepEl, countEl }
        var stepCounter = 0;
        var customItems = [];   // staged custom items {name}

        function makeSection(cat) {
            if (sections[cat]) return sections[cat];
            stepCounter++;
            var wrap = document.createElement('div'); wrap.className = 'section';
            var header = document.createElement('div'); header.className = 'section-header';
            header.innerHTML =
                '<span class="sec-step">' + stepCounter + '</span>' +
                '<span class="sec-emoji">' + COSTCO.catEmoji(cat) + '</span>' +
                '<span>' + COSTCO.catName(cat, lang) + '</span>' +
                '<span class="sec-count"></span>';
            var body = document.createElement('div');
            wrap.appendChild(header); wrap.appendChild(body); listEl.appendChild(wrap);
            sections[cat] = { wrap: wrap, body: body, header: header, total: 0, countEl: header.querySelector('.sec-count') };
            return sections[cat];
        }

        function refreshSection(cat) {
            var s = sections[cat]; if (!s) return;
            var done = s.body.querySelectorAll('input:checked').length;
            s.countEl.textContent = done + '/' + s.total;
            s.wrap.className = (done === s.total && s.total > 0) ? 'section done' : 'section';
        }

        var checked = 0;
        function refreshTotals() {
            checked = document.querySelectorAll('#list .item input:checked').length;
            var remaining = total - checked;
            document.getElementById('counter').innerHTML = remaining > 0 ? t.remaining(remaining, total) : t.allDone;
            var pct = total > 0 ? Math.round((checked / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = pct + '%';
        }

        function addRow(sec, cat, html, onChange) {
            var row = document.createElement('div'); row.className = 'item'; row.innerHTML = html;
            sec.body.appendChild(row);
            var cb = row.querySelector('input[type="checkbox"]');
            cb.addEventListener('change', function () {
                row.classList.toggle('checked', cb.checked);
                if (cat != null) refreshSection(cat);
                refreshTotals();
                if (onChange) onChange();
            });
            return row;
        }

        selection.forEach(function (s, idx) {
            var sec = makeSection(s.cat); sec.total++;
            var qtyBadge = s.qty > 1 ? ' <span class="qty-pill">×' + s.qty + '</span>' : '';
            addRow(sec, s.cat,
                '<input type="checkbox" id="i' + idx + '">' +
                '<label for="i' + idx + '">' + s.emoji + ' ' + s.name + '</label>' + qtyBadge);
            refreshSection(s.cat);
        });

        // Custom items get their own section at the end of the route
        var customSec = null;
        function customSection() {
            if (customSec) return customSec;
            stepCounter++;
            var wrap = document.createElement('div'); wrap.className = 'section';
            wrap.innerHTML = '<div class="section-header"><span class="sec-step">' + stepCounter +
                '</span><span class="sec-emoji">➕</span><span>' + t.added + '</span></div>';
            var body = document.createElement('div'); wrap.appendChild(body); listEl.appendChild(wrap);
            customSec = { body: body };
            // keep the add card + bottom bar after sections
            return customSec;
        }

        customFromUrl.forEach(function (name, i) {
            var sec = customSection();
            var row = document.createElement('div'); row.className = 'item pending';
            row.innerHTML = '<input type="checkbox" id="c' + i + '"><label for="c' + i + '">' +
                COSTCO.itemEmoji(name) + ' ' + name + ' <span class="qty-pill" style="background:#fde9c8;color:#a86a12">' + t.pending + '</span></label>';
            sec.body.appendChild(row);
            var cb = row.querySelector('input');
            cb.addEventListener('change', function () { row.classList.toggle('checked', cb.checked); refreshTotals(); });
            customItems.push({ name: name });
        });

        if (total === 0) listEl.innerHTML = '<div class="empty">' + t.empty + '</div>';

        window.addCustomItem = function () {
            var input = document.getElementById('custom-item');
            var name = input.value.trim();
            if (!name) { alert(t.emptyName); return; }
            var sec = customSection();
            var id = 'cu' + Date.now();
            var row = document.createElement('div'); row.className = 'item pending';
            row.innerHTML = '<input type="checkbox" id="' + id + '"><label for="' + id + '">' +
                COSTCO.itemEmoji(name) + ' ' + name + '</label>';
            sec.body.appendChild(row);
            var cb = row.querySelector('input');
            cb.addEventListener('change', function () { row.classList.toggle('checked', cb.checked); refreshTotals(); });
            customItems.push({ name: name });
            total++; input.value = ''; refreshTotals();
        };

        window.doneShopping = function () {
            var found = [], missing = [];
            document.querySelectorAll('#list .item').forEach(function (row) {
                var cb = row.querySelector('input[type="checkbox"]');
                var label = row.querySelector('label').textContent.trim();
                (cb.checked ? found : missing).push(label);
            });
            var cost = prompt(t.cost);
            var dateStr = new Date().toLocaleDateString(lang === 'pt' ? 'pt-BR' : 'en-CA');

            try {
                var logs = JSON.parse(localStorage.getItem('costco_shopping_logs') || '[]');
                logs.push({ date: new Date().toISOString(), dateFormatted: dateStr, lang: lang,
                    totalItems: total, foundItems: found, missingItems: missing,
                    customItems: customItems, totalCost: cost || 'Not provided' });
                localStorage.setItem('costco_shopping_logs', JSON.stringify(logs));
            } catch (e) {}

            var summary = '🛒 Costco — ' + dateStr + '\n\n' +
                '✅ ' + t.found + ': ' + found.length + '\n' +
                '❌ ' + t.missing + ': ' + missing.length + '\n' +
                '💰 ' + t.total + ': ' + (cost ? '$' + cost : t.notProvided);
            if (missing.length && missing.length <= 12) {
                summary += '\n\n❌ ' + t.missing + ':\n' + missing.map(function (m) { return '• ' + m; }).join('\n');
            }

            if (confirm(t.share)) {
                if (navigator.share) {
                    navigator.share({ title: 'Costco Shopping', text: summary }).catch(function () { copy(summary); alert(t.copied); });
                } else { copy(summary); alert(t.copied); }
            } else { alert(t.savedLocal); }

            if (confirm(t.returnQ)) window.location.href = 'index.html';
        };

        function copy(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return; }
            var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta);
        }

        refreshTotals();
    })();
    </script>
</body>
</html>
