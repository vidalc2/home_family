<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Costco List">
    <title>Costco Shopping List</title>
    <style>
        :root {
            --brand: #667eea;
            --brand-2: #764ba2;
            --green: #25D366;
            --ink: #2b2f38;
            --muted: #7a8190;
            --bg: #eef0f6;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px; margin: 0 auto; color: var(--ink); background: var(--bg);
            /* keep content clear of the iPhone notch sides and the fixed Done button + home indicator */
            padding:
                0
                calc(14px + env(safe-area-inset-right))
                calc(150px + env(safe-area-inset-bottom))
                calc(14px + env(safe-area-inset-left));
        }

        /* App header */
        .app-header {
            margin: 0 calc(-14px - env(safe-area-inset-right)) 14px calc(-14px - env(safe-area-inset-left));
            padding: calc(18px + env(safe-area-inset-top)) 16px 20px;
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            color: #fff; text-align: center;
            border-radius: 0 0 22px 22px; box-shadow: 0 6px 18px rgba(102,126,234,0.35);
        }
        .app-header img {
            width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
            border: 3px solid rgba(255,255,255,0.65); box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        h1 { font-size: 22px; margin: 10px 0 2px; color: #fff; letter-spacing: 0.3px; }
        .date { font-size: 13px; color: rgba(255,255,255,0.9); margin: 0; }

        /* Status / progress card */
        .status-card {
            background: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        }
        .counter { text-align: center; font-size: 15px; font-weight: 600; color: var(--ink); margin: 0 0 10px; }
        .counter b { color: var(--brand); }
        .progress-wrap { height: 12px; background: #e7e9f0; border-radius: 10px; overflow: hidden; }
        .progress-bar {
            height: 100%; width: 0;
            background: linear-gradient(90deg, #34d977, var(--green));
            border-radius: 10px; transition: width 0.35s ease;
        }

        /* Sections */
        .section {
            background: #fff; border-radius: 16px; margin: 0 0 16px; overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        }
        .section-header {
            display: flex; align-items: center; gap: 10px; padding: 13px 16px;
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            color: #fff; font-size: 16px; font-weight: 700;
            position: sticky; top: 0; z-index: 5;
        }
        .section-header .sec-emoji { font-size: 19px; line-height: 1; }
        .section-header .sec-count {
            margin-left: auto; font-size: 13px; font-weight: 600;
            background: rgba(255,255,255,0.25); padding: 3px 11px; border-radius: 20px; min-width: 42px; text-align: center;
        }
        .section.done .section-header { background: linear-gradient(135deg, #2bbf63, var(--green)); }

        /* Items */
        .item {
            padding: 14px 16px; background: #fff; border-bottom: 1px solid #eef0f4;
            display: flex; align-items: center; gap: 14px; transition: background 0.15s ease;
        }
        .item:last-child { border-bottom: none; }
        .item input[type="checkbox"] {
            width: 24px; height: 24px; flex-shrink: 0; cursor: pointer;
            accent-color: var(--green); margin: 0;
        }
        .item label { flex: 1; cursor: pointer; font-size: 16px; line-height: 1.35; }
        .item.checked { background: #effaf1; }
        .item.checked label { text-decoration: line-through; color: var(--muted); }

        /* Add-item card */
        .add-card { background: #fff; border-radius: 16px; padding: 16px; margin: 4px 0 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
        .add-card h3 { margin: 0 0 12px; color: var(--brand); font-size: 16px; }
        .add-card input[type="text"] {
            width: 100%; padding: 12px 14px; margin-bottom: 10px; border: 2px solid #e2e5ee;
            border-radius: 10px; font-size: 16px; outline: none; transition: border-color 0.15s ease;
        }
        .add-card input[type="text"]:focus { border-color: var(--brand); }
        .btn-add {
            width: 100%; padding: 13px; background: var(--brand); color: #fff; border: none;
            border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .btn-add:active { transform: scale(0.99); }

        /* Done button */
        .btn-done {
            width: calc(100% - 28px); max-width: 572px; position: fixed;
            bottom: calc(14px + env(safe-area-inset-bottom)); left: 50%;
            transform: translateX(-50%); padding: 16px; color: #fff; border: none; border-radius: 14px;
            font-size: 18px; font-weight: 700; cursor: pointer; z-index: 20;
            background: linear-gradient(135deg, #2bbf63, var(--green));
            box-shadow: 0 6px 18px rgba(37,211,102,0.45);
        }
        .btn-done:active { transform: translateX(-50%) scale(0.99); }

        .back { text-align: center; margin: 18px 0; }
        .back a { color: var(--brand); text-decoration: none; font-size: 15px; font-weight: 600; }
    </style>
</head>

        function getItemEmoji(itemName) {
            for (var key in itemEmojis) {
                if (itemName.toLowerCase().includes(key.toLowerCase())) {
                    return itemEmojis[key] + ' ';
                }
            }
            return '';
        }
        
        // Group items into store-section "stops", preserving the route order from the URL
        var names = categoryNames[lang] || categoryNames.en;
        var sectionEls = {};        // catIdx -> { wrap, body, header, total }

        function getCatIdx(id) {
            var parts = id.split('-');           // lang-CATEGORY-ITEM
            return parts.length >= 3 ? parseInt(parts[1], 10) : NaN;
        }

        function ensureSection(catIdx) {
            if (sectionEls[catIdx]) return sectionEls[catIdx];
            var wrap = document.createElement('div');
            wrap.className = 'section';
            var header = document.createElement('div');
            header.className = 'section-header';
            var emoji = !isNaN(catIdx) && categoryEmojis[catIdx] ? categoryEmojis[catIdx] : '🛒';
            var title = !isNaN(catIdx) && names[catIdx] ? names[catIdx] : (lang === 'pt' ? 'Outros' : 'Other');
            header.innerHTML = '<span class="sec-emoji">' + emoji + '</span><span>' + title + '</span><span class="sec-count"></span>';
            var body = document.createElement('div');
            wrap.appendChild(header);
            wrap.appendChild(body);
            listDiv.appendChild(wrap);
            sectionEls[catIdx] = { wrap: wrap, body: body, header: header, total: 0 };
            return sectionEls[catIdx];
        }

        function updateSection(catIdx) {
            var sec = sectionEls[catIdx];
            if (!sec) return;
            var done = sec.body.querySelectorAll('input:checked').length;
            sec.header.querySelector('.sec-count').textContent = done + '/' + sec.total;
            sec.wrap.className = (done === sec.total && sec.total > 0) ? 'section done' : 'section';
        }

        itemIds.forEach(function(id) {
            var catIdx = getCatIdx(id);
            var sec = ensureSection(catIdx);
            sec.total++;

            var itemName = itemMap[id] || id;
            var emoji = getItemEmoji(itemName);
            var qty = quantities[id] || '1';
            var itemDiv = document.createElement('div');
            itemDiv.className = 'item';
            itemDiv.innerHTML = '<input type="checkbox" id="' + id + '"><label for="' + id + '">' + emoji + itemName + ' (x' + qty + ')</label>';
            sec.body.appendChild(itemDiv);

            var checkbox = itemDiv.querySelector('input');
            checkbox.addEventListener('change', function() {
                itemDiv.className = this.checked ? 'item checked' : 'item';
                checked = document.querySelectorAll('input:checked').length;
                updateSection(catIdx);
                updateCounter();
            });
            updateSection(catIdx);
        });
        
        // Custom / extra items live in their own section at the end of the route
        var customSectionBody = null;
        function getCustomSectionBody() {
            if (customSectionBody) return customSectionBody;
            var wrap = document.createElement('div');
            wrap.className = 'section';
            var header = document.createElement('div');
            header.className = 'section-header';
            header.innerHTML = '<span>➕</span><span>' + (lang === 'pt' ? 'Itens Adicionados' : 'Added Items') + '</span>';
            customSectionBody = document.createElement('div');
            wrap.appendChild(header);
            wrap.appendChild(customSectionBody);
            listDiv.appendChild(wrap);
            return customSectionBody;
        }

        customItemsFromUrl.forEach(function(itemName, index) {
            var customId = 'pending-' + index;
            var itemDiv = document.createElement('div');
            itemDiv.className = 'item';
            itemDiv.style.background = '#fff9e6';
            itemDiv.innerHTML = '<input type="checkbox" id="' + customId + '" checked><label for="' + customId + '">❓ ' + itemName + ' <span style="font-size: 11px; color: #f57c00;">(PENDING APPROVAL)</span></label>' +
                '<button onclick="approveCustomItem(\'' + customId + '\', \'' + itemName + '\', false)" style="padding: 4px 8px; background: #667eea; color: white; border: none; border-radius: 3px; font-size: 12px; margin-left: 5px;">✓ Add to Main</button>' +
                '<button onclick="approveCustomItem(\'' + customId + '\', \'' + itemName + '\', true)" style="padding: 4px 8px; background: #f57c00; color: white; border: none; border-radius: 3px; font-size: 12px; margin-left: 5px;">#OneTime</button>';
            getCustomSectionBody().appendChild(itemDiv);

            var checkbox = itemDiv.querySelector('input');
            checkbox.addEventListener('change', function() {
                itemDiv.style.background = this.checked ? '#fff9e6' : '#fff';
                updateCounter();
            });
        });
        
        function updateCounter() {
            checked = document.querySelectorAll('input:checked').length;
            var remaining = total - checked;
            var text = lang === 'en'
                ? '<b>' + remaining + '</b> remaining of ' + total + ' items'
                : '<b>' + remaining + '</b> restantes de ' + total + ' itens';
            document.getElementById('counter').innerHTML = text;
            var pct = total > 0 ? Math.round((checked / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = pct + '%';
        }
        
        var customItems = [];
        var approvedCustomItems = [];
        
        function approveCustomItem(itemId, itemName, oneTimeOnly) {
            var itemDiv = document.getElementById(itemId).parentElement;
            itemDiv.style.background = '#e8f5e9';
            itemDiv.innerHTML = '<input type="checkbox" id="' + itemId + '" checked><label for="' + itemId + '">✅ ' + itemName + (oneTimeOnly ? ' <span style="font-size: 11px; color: #f57c00;">#onetimeonly</span>' : '') + '</label>';
            
            approvedCustomItems.push({
                name: itemName,
                oneTimeOnly: oneTimeOnly,
                id: itemId
            });
            
            var checkbox = itemDiv.querySelector('input');
            checkbox.addEventListener('change', function() {
                itemDiv.className = this.checked ? 'item checked' : 'item';
                updateCounter();
            });
            
            customItems.push({
                name: itemName,
                oneTimeOnly: oneTimeOnly,
                id: itemId
            });
        }
        
        function addCustomItem() {
            var input = document.getElementById('custom-item');
            var itemName = input.value.trim();
            if (!itemName) {
                alert(lang === 'en' ? 'Please enter an item name' : 'Por favor, digite o nome do item');
                return;
            }
            
            var addToMain = confirm(lang === 'en' 
                ? 'Add "' + itemName + '" to main list for future use?\n\nClick OK to add to main list\nClick Cancel for one-time only'
                : 'Adicionar "' + itemName + '" à lista principal para uso futuro?\n\nClique OK para adicionar à lista principal\nClique Cancelar para uso único');
            
            var customId = 'custom-' + Date.now();
            var itemDiv = document.createElement('div');
            itemDiv.className = 'item';
            itemDiv.style.background = '#fff9e6';
            itemDiv.innerHTML = '<input type="checkbox" id="' + customId + '"><label for="' + customId + '">' + itemName + (addToMain ? '' : ' #onetimeonly') + '</label>';
            getCustomSectionBody().appendChild(itemDiv);
            
            var checkbox = itemDiv.querySelector('input');
            checkbox.addEventListener('change', function() {
                itemDiv.className = this.checked ? 'item checked' : 'item';
                total++;
                updateCounter();
            });
            
            customItems.push({
                name: itemName,
                oneTimeOnly: !addToMain,
                id: customId
            });
            
            input.value = '';
            total++;
            updateCounter();
        }
        
        function doneShoppingPrompt() {
            var allItems = document.querySelectorAll('.item');
            var found = [];
            var missing = [];
            
            allItems.forEach(function(item) {
                var checkbox = item.querySelector('input');
                var label = item.querySelector('label');
                var itemName = label.textContent;
                
                if (checkbox.checked) {
                    found.push(itemName);
                } else {
                    missing.push(itemName);
                }
            });
            
            var totalCost = prompt(lang === 'en' 
                ? 'Enter total amount paid (optional):'
                : 'Digite o valor total pago (opcional):');
            
            var logData = {
                date: new Date().toISOString(),
                dateFormatted: document.getElementById('date').textContent,
                lang: lang,
                totalItems: total,
                foundItems: found,
                missingItems: missing,
                customItems: customItems,
                totalCost: totalCost || 'Not provided'
            };
            
            // Save to localStorage for this device
            var logs = JSON.parse(localStorage.getItem('costco_shopping_logs') || '[]');
            logs.push(logData);
            localStorage.setItem('costco_shopping_logs', JSON.stringify(logs));
            
            // Create shareable summary message
            var summary = '🛒 Costco Shopping - ' + document.getElementById('date').textContent + '\n\n' +
                '✅ ' + (lang === 'en' ? 'Found: ' : 'Encontrados: ') + found.length + ' items\n' +
                '❌ ' + (lang === 'en' ? 'Missing: ' : 'Faltaram: ') + missing.length + ' items\n' +
                '💰 ' + (lang === 'en' ? 'Total: ' : 'Total: ') + (totalCost ? '$' + totalCost : (lang === 'en' ? 'Not provided' : 'Não informado'));
            
            if (missing.length > 0 && missing.length <= 10) {
                summary += '\n\n' + (lang === 'en' ? '❌ Missing:\n' : '❌ Faltaram:\n') + missing.map(function(item) { return '• ' + item; }).join('\n');
            } else if (missing.length > 10) {
                summary += '\n\n' + (lang === 'en' ? '❌ ' + missing.length + ' items were missing' : '❌ ' + missing.length + ' itens faltaram');
            }
            
            if (customItems.length > 0) {
                summary += '\n\n' + (lang === 'en' ? '➕ Custom items:\n' : '➕ Itens personalizados:\n') + customItems.map(function(item) { return '• ' + item.name; }).join('\n');
            }
            
            // Ask if user wants to share
            var shareMsg = lang === 'en' 
                ? 'Shopping complete!\n\nWould you like to share this log with the family?'
                : 'Compras concluídas!\n\nGostaria de compartilhar este registro com a família?';
            
            if (confirm(shareMsg)) {
                // Try to share via native share API
                if (navigator.share) {
                    navigator.share({
                        title: 'Costco Shopping Log',
                        text: summary
                    }).catch(function(err) {
                        // Fallback: copy to clipboard
                        copyToClipboard(summary);
                        alert(lang === 'en' 
                            ? '✅ Log copied to clipboard! Now you can paste it in WhatsApp or email.'
                            : '✅ Registro copiado! Agora você pode colar no WhatsApp ou email.');
                    });
                } else {
                    // Fallback: copy to clipboard
                    copyToClipboard(summary);
                    alert(lang === 'en' 
                        ? '✅ Log copied to clipboard! Now you can paste it in WhatsApp or email to share with everyone.'
                        : '✅ Registro copiado! Agora você pode colar no WhatsApp ou email para compartilhar com todos.');
                }
            } else {
                alert(lang === 'en' 
                    ? '✅ Log saved locally on this device only.'
                    : '✅ Registro salvo localmente apenas neste dispositivo.');
            }
            
            if (confirm(lang === 'en' ? 'Return to main list?' : 'Voltar à lista principal?')) {
                window.location.href = 'index.html';
            }
        }
        
        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
            } else {
                // Fallback for older browsers
                var textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            }
        }
        
        updateCounter();
    </script>
