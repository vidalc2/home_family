<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#5b6ef5">
    <title>Shopping History</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <style>
        .log { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
        .log-date { font-weight: 800; color: var(--brand-ink); font-size: 17px; }
        .log-cost { color: var(--green-2); font-weight: 700; font-size: 15px; }
        .log-stats { display: flex; gap: 10px; margin: 10px 0; }
        .stat { padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; }
        .stat-found { background: #effbf4; color: #137a45; }
        .stat-missing { background: #fdecec; color: #c0392b; }
        .items-section { margin: 12px 0 4px; }
        .items-section h4 { margin: 4px 0; color: var(--ink-soft); font-size: 13px; font-weight: 700; }
        .items-list { font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
        .custom-tag { background: var(--warn-bg); color: var(--warn); padding: 2px 8px; border-radius: 999px; font-size: 11px; margin-left: 5px; }
        .clear-btn { width: 100%; background: #fdecec; color: #c0392b; border: 1.5px solid #f0b4b4; padding: 12px; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="app-header">
        <img class="logo" src="family-logo.png" alt="Family Logo">
        <h1>📊 Shopping History</h1>
        <p class="subtitle">Histórico de Compras</p>
        <a class="header-link" href="index.html">← Back / Voltar</a>
    </div>

    <button class="clear-btn" onclick="clearHistory()">🗑️ Clear All History / Limpar Histórico</button>

    <div id="logs"></div>

    <div class="back"><a href="index.html">← Back to main list / Voltar à lista principal</a></div>

    <script>
        function loadLogs() {
            var logs = JSON.parse(localStorage.getItem('costco_shopping_logs') || '[]');
            var logsDiv = document.getElementById('logs');
            
            if (logs.length === 0) {
                logsDiv.innerHTML = '<div class="empty">No shopping history yet / Nenhum histórico ainda</div>';
                return;
            }
            
            logs.reverse().forEach(function(log) {
                var logDiv = document.createElement('div');
                logDiv.className = 'log';
                
                var header = '<div class="log-header">' +
                    '<span class="log-date">' + log.dateFormatted + '</span>' +
                    '<span class="log-cost">💰 ' + log.totalCost + '</span>' +
                    '</div>';
                
                var stats = '<div class="log-stats">' +
                    '<div class="stat stat-found">✅ Found: ' + log.foundItems.length + '</div>' +
                    '<div class="stat stat-missing">❌ Missing: ' + log.missingItems.length + '</div>' +
                    '</div>';
                
                var missing = '';
                if (log.missingItems.length > 0) {
                    missing = '<div class="items-section">' +
                        '<h4>Missing Items / Itens Faltantes:</h4>' +
                        '<div class="items-list">' + log.missingItems.join(', ') + '</div>' +
                        '</div>';
                }
                
                var custom = '';
                if (log.customItems && log.customItems.length > 0) {
                    custom = '<div class="items-section">' +
                        '<h4>Custom Items / Itens Adicionados:</h4>' +
                        '<div class="items-list">';
                    log.customItems.forEach(function(item) {
                        custom += item.name + (item.oneTimeOnly ? '<span class="custom-tag">#onetimeonly</span>' : '') + ', ';
                    });
                    custom = custom.slice(0, -2) + '</div></div>';
                }
                
                logDiv.innerHTML = header + stats + missing + custom;
                logsDiv.appendChild(logDiv);
            });
        }
        
        function clearHistory() {
            if (confirm('Are you sure you want to clear all history?\n\nTem certeza que deseja limpar todo o histórico?')) {
                localStorage.removeItem('costco_shopping_logs');
                location.reload();
            }
        }
        
        loadLogs();
    </script>
</body>
</html>
